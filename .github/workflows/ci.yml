name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --python 3.12 --frozen --extra dev
      - run: uv run --python 3.12 --frozen --extra dev pip-audit
      - run: uv run --python 3.12 --frozen --extra dev ruff check .
      - run: uv run --python 3.12 --frozen --extra dev pytest -q
      - run: uv run --python 3.12 --frozen python -c "from parsemedicalexams import *"
      - run: uv build
