name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --python 3.12 --frozen --extra dev
      - run: uv run --python 3.12 --frozen --extra dev pip-audit
      - run: uv run --python 3.12 --frozen --extra dev ruff check .
      - run: uv run --python 3.12 --frozen --extra dev pytest -q
      - run: uv run --python 3.12 --frozen python -c "from parsemedicalexams import *"
      - run: uv build
