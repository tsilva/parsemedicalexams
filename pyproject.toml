[project]
name = "parsemedicalexams"
dynamic = ["version"]
description = "Extract and summarize medical exam reports (X-rays, MRIs, ultrasounds, etc.) with AI precision"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Tiago Silva", email = "tiago@tsilva.com"}
]
keywords = ["medical", "exam-parser", "ai", "document-processing", "radiology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "openai",
    "pillow>=12.3.0",
    "pdf2image",
    "python-dotenv>=1.2.2",
    "pydantic",
    "pyyaml",
    "tqdm",
    "typing-extensions",
]

[project.optional-dependencies]
dev = [
    "pip-audit>=2.9.0",
    "pytest>=9.0.3",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
    "types-tqdm",
]

[project.scripts]
parsemedicalexams = "parsemedicalexams.cli:main"

[project.urls]
Homepage = "https://github.com/tsilva/parsemedicalexams"
Repository = "https://github.com/tsilva/parsemedicalexams"
Issues = "https://github.com/tsilva/parsemedicalexams/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "parsemedicalexams/__init__.py"

[tool.hatch.build]
skip-excluded-dirs = true

[tool.hatch.build.targets.sdist]
only-include = [
    "parsemedicalexams",
    "prompts",
    "tests",
    ".env.example",
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["parsemedicalexams"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "prompts"
".env.example" = ".env.example"

[tool.ruff]
line-length = 100
exclude = [
    ".agents",
    ".claude",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
required-version = "==0.11.13"
exclude-newer = "7 days"
constraint-dependencies = [
  "pygments>=2.20.0",
  "mistralai!=2.4.6",
  "guardrails-ai!=0.10.1",
]
